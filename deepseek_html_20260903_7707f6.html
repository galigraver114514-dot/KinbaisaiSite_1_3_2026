<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文化祭 - こっくりさんからの脱出</title>
    <!-- 引入适合恐怖风格的像素字体，注意版权需使用 Google Fonts 免费资源 -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'DotGothic16', sans-serif;
            cursor: none; /* 隐藏默认鼠标 */
        }

        #bg-anim {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 3s ease-in-out;
            z-index: -1;
        }

        /* 入场动画：1. 文字浮现 */
        .title-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            z-index: 10;
            opacity: 0;
            animation: fadeInAndBleed 5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s forwards;
        }

        .title {
            font-size: 4rem;
            color: #e74c3c;
            text-shadow: 0 0 15px #c0392b, 0 0 30px #900;
            letter-spacing: 0.1em;
            mix-blend-mode: screen;
        }

        /* 入场动画：2. 文字根据心脏搏动节奏抖动 */
        .subtitle {
            font-size: 1.2rem;
            color: #ccc;
            margin-top: 40px;
            letter-spacing: 0.5em;
            filter: blur(1px);
            text-shadow: 0 0 5px #000;
        }

        /* 入场动画：3. 光晕颤抖效果 */
        @keyframes flicker {
            0%, 19%, 21%, 23%, 80%, 100% { opacity: 0.99; text-shadow: 0 0 30px #c0392b; }
            20%, 22%, 82% { opacity: 0.4; text-shadow: none; }
        }

        .title, .subtitle {
            animation: flicker 3s infinite;
        }

        @keyframes fadeInAndBleed {
            from { opacity: 0; transform: translate(-50%, -50%) scale(1.1); filter: blur(10px); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
        }

        /* 鼠标跟随：黑色雾气（模拟手部阴影） */
        #cursor-shadow {
            position: absolute;
            width: 100px; 
            height: 100px;
            background: radial-gradient(circle, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none; /* 允许穿透继续点击 */
            z-index: 5;
            filter: blur(15px);
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <!-- 背景图：请替换为在 BOOTH 购买的合法或免费的こっくりさん背景素材 [citation:1][citation:13] -->
    <img id="bg-anim" src="https://via.placeholder.com/1920x1080/000000/000000?text=Background+Asset" alt="">

    <!-- 鼠标跟随特效的图层 -->
    <div id="cursor-shadow"></div>

    <div class="title-box">
        <div class="title">こっくりさんからの脱出</div>
        <div class="subtitle">～次はお前だ～</div>
        <div class="subtitle" style="font-size: 0.8rem; margin-top: 20px;">ようこそ、開けてはいけない文化祭へ。</div>
    </div>

    <script>
        // 入场初始化
        setTimeout(() => {
            document.getElementById('bg-anim').style.opacity = '1'; // 背景淡入
        }, 100);

        // 鼠标跟随实现
        document.addEventListener('mousemove', (e) => {
            const follower = document.getElementById('cursor-shadow');
            follower.style.left = e.clientX + 'px';
            follower.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
