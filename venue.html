<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会場案内｜The Last Bell ― 文化祭出し物</title>
<!-- 会場案内：上方＝俯視マップ（高さの段で各棟のフロアを表示）＋下方＝棟別展開図 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Kaisei+Tokumin:wght@700;900&family=Shippori+Mincho:wght@500;600&family=Yuji+Syuku&family=Special+Elite&family=Metal+Mania&family=Rye&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/site.css">
<style>
  #planCard{position:relative; margin:0 auto; width:min(97%,1200px);
    background:radial-gradient(130% 130% at 50% 0%, #10162e 0%, #0a0d1e 62%, #070a16 100%);
    border:1px solid rgba(30,20,45,.0); border-radius:2px;
    box-shadow:0 10px 34px rgba(0,0,0,.5); overflow:hidden}
  #planBar{display:flex; align-items:center; gap:.8em; flex-wrap:wrap; padding:.65em 1em;
    border-bottom:1px solid rgba(150,170,220,.16)}
  #planBar label{font-family:"Kaisei Tokumin",serif; font-size:.85rem; letter-spacing:.18em; color:#e9dcc0}
  #planFloor{font-family:"DotGothic16",monospace; font-size:.8rem; color:#f2ecd8; max-width:100%;
    background:#1a2138; border:1px solid rgba(150,170,220,.4); border-radius:2px; padding:.28em .7em}
  #planSearch{font-family:"DotGothic16",monospace; font-size:.82rem; color:#f2ecd8;
    background:#10162a; border:1px solid rgba(150,170,220,.45); border-radius:2px; padding:.3em .7em;
    min-width:min(240px,58vw)}
  #planSearchBtn{font-family:"Kaisei Tokumin",serif; font-size:.85rem; letter-spacing:.14em;
    color:#ffd9c9; background:linear-gradient(180deg,#5c1824,#3a0f1a);
    border:1px solid rgba(224,70,90,.6); border-radius:2px; padding:.3em .9em; cursor:pointer}
  #planSearchBtn:hover{filter:brightness(1.2)}
  #searchMsg{font-family:"DotGothic16",monospace; font-size:.7rem; color:#ffd9a0; letter-spacing:.06em}
  #searchPick{font-family:"DotGothic16",monospace; font-size:.82rem; color:#f2ecd8; max-width:100%;
    background:#1a2138; border:1px solid rgba(255,205,120,.5); border-radius:2px; padding:.3em .6em;
    outline:2px solid rgba(255,205,120,.25)}
  #planHint{font-family:"DotGothic16",monospace; font-size:.6rem; letter-spacing:.16em; color:#8b97ad; margin-left:auto}
  #planSvgWrap{width:100%; overflow:auto}
  #planSvg{display:block; width:100%; height:auto}
  #planSvg text{pointer-events:none}
  #planSvg .room{cursor:pointer}
  #planSvg .room:hover{filter:brightness(1.15)}
  #planSvg .room.sel{stroke:#ffd9a0 !important; stroke-width:2.2px}
  #planSvg .room.hit{stroke:#ffd23e !important; stroke-width:3.2px;
    filter:drop-shadow(0 0 5px rgba(255,210,80,.95)) brightness(1.12);
    animation:hitPulse .7s ease-in-out 3}
  @keyframes hitPulse{50%{filter:drop-shadow(0 0 9px #ffd23e) brightness(1.3)}}
  .exRoom.hit{outline:2px solid #ffd23e; box-shadow:0 0 7px rgba(255,210,80,.9); transform:scale(1.04)}
  #planLeg{margin:.8vh auto 0; width:min(97%,1200px); display:flex; gap:1.1em; flex-wrap:wrap;
    font-family:"DotGothic16",monospace; font-size:.6rem; letter-spacing:.1em; color:#b6bfd0;
    text-shadow:0 1px 8px rgba(0,0,0,.9)}
  /* カードと背景の間に置くなめらかな明暗の橋（両端はカード地色から透明へ） */
  .vFade{width:min(97%,1200px); margin:0 auto; height:46px; pointer-events:none}
  .vFade.out{background:linear-gradient(180deg, #070a16 0%, rgba(7,10,22,0) 100%)}
  .vFade.in{background:linear-gradient(180deg, rgba(7,10,22,0) 0%, #10162e 100%)}
  #planLeg i{display:inline-block; width:11px; height:11px; margin-right:.3em; vertical-align:-1px}
  /* 展開図 */
  #exCard{position:relative; margin:0 auto; width:min(97%,1200px);
    background:radial-gradient(130% 130% at 50% 0%, #10162e 0%, #0a0d1e 62%, #070a16 100%);
    border:1px solid rgba(30,20,45,.0); border-radius:2px;
    box-shadow:0 10px 34px rgba(0,0,0,.5); padding:1em 1.2em 1.1em;
    overflow:hidden}
  .exHead{font-family:"Kaisei Tokumin",serif; font-weight:900; font-size:1.05rem;
    letter-spacing:.24em; color:#efe3c8}
  .exHead span{font-family:"Shippori Mincho",serif; font-weight:400; font-size:.7rem;
    letter-spacing:.06em; color:#9aa6b8; margin-left:1em}
  #exPanel{display:grid; gap:1.1em; margin-top:.9em}
  .exBldg{border:1px solid rgba(150,170,220,.25); border-radius:3px; overflow:hidden}
  .exBldg .exName{font-family:"Yuji Syuku",serif; font-size:1rem; letter-spacing:.28em;
    padding:.35em .9em; color:#1a1f30}
  .exFloor{display:flex; border-top:1px solid rgba(150,170,220,.14)}
  .exFloor .fl{flex:0 0 4.2em; display:flex; align-items:center; justify-content:center;
    font-family:"DotGothic16",monospace; font-size:.72rem; color:#dfe6f2;
    background:rgba(20,26,44,.7); border-right:1px solid rgba(150,170,220,.2)}
  .exFloor .rooms{flex:1; display:flex; flex-wrap:wrap; gap:.4em; padding:.5em .65em; align-items:center}
  .exRoom{font-family:"Yuji Syuku",serif; font-size:.8rem; line-height:1.35;
    background:#fbfaf5; color:#3c4254; border:1px solid #a8adbd; border-radius:2px;
    padding:.14em .55em; white-space:nowrap}
  .exRoom.wc,.exRoom.st{background:#e8ebf2; color:#5a6480}
  .exRoom.star{background:#c0392b; color:#fff; border-color:#8e2118; font-weight:bold}
  .exRoom.star::after{content:"★"; margin-left:.35em}
  .exCorr{font-family:"DotGothic16",monospace; font-size:.6rem; letter-spacing:.06em;
    color:#93a6cf; background:rgba(120,140,200,.13); padding:.22em .5em; border-radius:2px}
  .exNote{font-family:"Shippori Mincho",serif; font-size:.72rem; color:#8b97ad; margin-top:.9em}
  /* ===== 会場案内の背景：VHSテープ映像風（均一な暗色地＋ノイズ＋走査線） ===== */
  body.venue-page{
    background:
      radial-gradient(120% 80% at 50% 6%, rgba(88,108,150,.20), rgba(5,7,12,0) 58%),
      linear-gradient(180deg,#04060b 0%,#0a0d18 46%,#070910 100%)}
  .scene{position:relative; min-height:100%}
  /* 映像の粒ノイズ（文書と同じ高さに敷いてスクロールでも継ぎ目なし） */
  .scene .vhsnoise{position:absolute; inset:0; z-index:0; pointer-events:none; display:block;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='ns'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23ns)' opacity='0.7'/></svg>");
    opacity:.12; animation:noiseFlick 3.6s steps(4) infinite}
  @keyframes noiseFlick{0%,100%{opacity:.10}25%{opacity:.16}50%{opacity:.07}75%{opacity:.13}}
  .scene .wrap{position:relative; z-index:1}
  /* 走査線＋周辺減光（映像画面として全画面に固定） */
  body.venue-page::after{content:""; position:fixed; inset:0; z-index:9998; pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(220,230,255,.055) 0 1px, transparent 1px 3px),
      radial-gradient(115% 100% at 50% 44%, transparent 62%, rgba(0,0,0,.46) 100%);
    mix-blend-mode:normal}
  /* たびたび画面を横切るトラッキング帯（2本・ずれて走る） */
  .vhsbar{position:fixed; left:0; right:0; top:-6px; height:5px; z-index:9999; pointer-events:none;
    background:linear-gradient(90deg, transparent 3%, rgba(255,50,110,.85) 26%, rgba(80,255,190,.7) 50%, rgba(80,190,255,.85) 74%, transparent 97%);
    box-shadow:0 0 14px rgba(255,70,120,.5), 0 2px 22px rgba(120,220,255,.35);
    filter:blur(.4px); animation:vhsRoll 7.5s linear infinite}
  .vhsbar.b2{height:2px; background:linear-gradient(90deg, transparent 12%, rgba(140,255,220,.5) 44%, rgba(255,90,140,.55) 60%, transparent 88%);
    animation:vhsRoll 7.5s linear infinite; animation-delay:.5s}
  @keyframes vhsRoll{0%{transform:translateY(-2vh); opacity:0}
    62%{transform:translateY(6vh); opacity:0}
    65%{opacity:.85} 70%{transform:translateY(52vh); opacity:.35}
    75%{opacity:.8} 80%{transform:translateY(112vh); opacity:.6}
    84%{transform:translateY(128vh); opacity:.15}
    90%,100%{transform:translateY(132vh); opacity:0}}
  /* REC表示（録画中） */
  .recTag{position:fixed; right:14px; bottom:10px; z-index:9999; pointer-events:none;
    font-family:"DotGothic16",monospace; font-size:.78rem; letter-spacing:.2em; color:rgba(255,120,130,.9);
    display:flex; align-items:center; gap:.5em; text-shadow:0 0 10px rgba(255,40,60,.7)}
  .recTag i{width:11px; height:11px; border-radius:50%; background:#ff2536;
    box-shadow:0 0 12px rgba(255,40,70,1); animation:recBlink 1.1s steps(2) infinite}
  @keyframes recBlink{0%,55%{opacity:1}56%,100%{opacity:.1}}
  /* 録画タイムコード（右上・ちらつきながら減っていく） */
  .timecode{position:fixed; top:12px; right:14px; z-index:9998; pointer-events:none;
    font-family:"DotGothic16",monospace; font-size:.8rem; letter-spacing:.12em;
    color:rgba(214,228,255,.85); text-shadow:0 0 8px rgba(120,180,255,.7), 2px 0 0 rgba(255,60,110,.4), -2px 0 0 rgba(60,190,255,.4);
    animation:tcFlick 5s steps(1) infinite}
  @keyframes tcFlick{0%,86%,92%,100%{opacity:1}88%{opacity:.35}90%{opacity:.8}}

  /* ===== アニメーション（強調版） ===== */
  .site-page h1{animation:titleBreath 6s ease-in-out infinite, titleJit 7.5s ease-in-out infinite}
  @keyframes titleBreath{0%,100%{text-shadow:2px 0 0 rgba(255,60,110,.16), -2px 0 0 rgba(70,190,255,.15), 0 0 22px rgba(255,150,60,.20)}
    50%{text-shadow:2px 0 0 rgba(255,60,110,.28), -2px 0 0 rgba(70,190,255,.26), 0 0 82px rgba(255,185,95,.55)}}
  @keyframes titleJit{0%,88%,100%{transform:none; opacity:1}
    90%{transform:translateX(-1px) skewX(-.6deg); opacity:.92}
    92%{transform:translateX(1.5px) skewX(.4deg)}
    94%{transform:none; opacity:1}}
  .site-page .rule{animation:ruleGlow 3.6s ease-in-out infinite}
  @keyframes ruleGlow{0%,100%{opacity:.45; box-shadow:0 0 4px rgba(190,60,70,.25)}
    50%{opacity:1; box-shadow:0 0 16px rgba(226,80,90,.6)}}
  #planCard{animation:cardUp .95s cubic-bezier(.2,.7,.2,1) .05s both,
    cardGlow 3.4s ease-in-out .9s infinite}
  #exCard{animation:cardUp .95s cubic-bezier(.2,.7,.2,1) .25s both,
    cardGlow 3.4s ease-in-out 1.15s infinite}
  #planLeg{animation:cardUp .95s ease .45s both}
  @keyframes cardUp{from{opacity:0; transform:translateY(30px)}to{opacity:1; transform:none}}
  @keyframes cardGlow{0%,100%{box-shadow:0 26px 90px rgba(0,0,0,.78), 0 0 70px rgba(226,40,70,.05)}
    50%{box-shadow:0 30px 110px rgba(0,0,0,.86), 0 0 100px rgba(226,40,70,.12)}}
  .exBldg{animation:exIn .85s ease backwards}
  .exBldg:nth-child(1){animation-delay:.42s}
  .exBldg:nth-child(2){animation-delay:.55s}
  .exBldg:nth-child(3){animation-delay:.68s}
  .exBldg:nth-child(4){animation-delay:.81s}
  @keyframes exIn{from{opacity:0; transform:translateY(18px); filter:blur(4px)}
    to{opacity:1; transform:none; filter:none}}
  /* 地図：読込時は明るく走る・段の切替はフラッシュ */
  #planSvg{animation:svgIn .8s ease-out both}
  @keyframes svgIn{from{opacity:0; filter:brightness(2)}to{opacity:1; filter:none}}
  #planSvgWrap.fx #planSvg{animation:mapFlash .38s ease-out}
  @keyframes mapFlash{0%{filter:brightness(1.9) drop-shadow(0 0 14px rgba(190,225,255,.85)); opacity:.9}
    100%{filter:none; opacity:1}}
  #planSvg rect.star{animation:starGlow 2.2s ease-in-out infinite}
  @keyframes starGlow{0%,100%{filter:brightness(1) drop-shadow(0 0 3px rgba(255,90,70,.5))}
    50%{filter:brightness(1.65) drop-shadow(0 0 17px rgba(255,132,96,1))}}
  #planSvg .corr{animation:corrLight 3s ease-in-out infinite}
  @keyframes corrLight{0%,100%{opacity:.5}50%{opacity:1}}
  #planSvg .room{transition:filter .15s ease}
  .exRoom{transition:transform .18s ease, box-shadow .18s ease}
  .exRoom:hover{transform:translateY(-2px) scale(1.03); box-shadow:0 4px 14px rgba(0,0,0,.5)}
  /* カード内：走る光＋ごく淡い走査線（映像の枠らしく） */
  #planCard::before,#exCard::before{content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(60% 55% at 78% 10%, rgba(150,172,235,.10), transparent 60%);
    animation:cardSheen 8s ease-in-out infinite alternate}
  @keyframes cardSheen{0%{opacity:.4; transform:translateY(1.5%)}100%{opacity:1; transform:translateY(-2%)}}
  #planCard::after,#exCard::after{content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 1px, transparent 1px 3px);
    opacity:.35}

  /* 地図エリア：オーバーレイなし（霧は地図に被せない） */
  #planSvgWrap{position:relative; overflow:hidden}

  /* ===== ビュー切替（地図 / 展開図） ===== */
  #viewTabs{position:sticky; top:0; z-index:60; display:flex; gap:.7em; justify-content:center;
    padding:.75em 0; width:min(97%,1200px); margin:1.2vh auto 0;
    background:linear-gradient(180deg, rgba(4,6,12,.94) 0%, rgba(4,6,12,.72) 62%, rgba(4,6,12,0) 100%)}
  #viewTabs .tab{font-family:"Kaisei Tokumin",serif; font-weight:700; font-size:.92rem;
    letter-spacing:.2em; text-indent:.2em; color:#c9d2e2;
    background:rgba(24,30,54,.9); border:1px solid rgba(130,150,215,.45); border-radius:3px;
    padding:.48em 1.6em; cursor:pointer; white-space:nowrap;
    box-shadow:0 3px 12px rgba(0,0,0,.45);
    transition:color .2s, background .2s, border-color .2s, transform .15s}
  #viewTabs .tab:hover{color:#fff; border-color:rgba(255,170,120,.75); transform:translateY(-1px)}
  #viewTabs .tab.on{color:#1c1522; border-color:#f0dfae;
    background:linear-gradient(180deg,#f0dfb6,#cfb184)}
  .view{animation:viewIn .38s ease-out both}
  .view[hidden]{display:none}
  @keyframes viewIn{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}
  /* 展開図は広い画面では2列に並べ縦を短く */
  #exPanel{grid-template-columns:1fr}
  @media (min-width:820px){ #exPanel{grid-template-columns:repeat(2, minmax(0, 1fr))} }

  /* ============ 一画面レイアウト：地図/並列/展開図 の3モード ============ */
  body.venue-page{overflow:hidden; height:100vh}
  body.venue-page .wrap{width:100vw; max-width:none; height:100vh; margin:0;
    padding:.6vh 1.1vw .6vh; display:flex; flex-direction:column; z-index:1}
  body.venue-page .vHead{flex:0 0 auto; display:flex; align-items:baseline; gap:1.4em;
    flex-wrap:wrap; padding:.35vh 0 .45vh;
    border-bottom:1px solid rgba(120,150,220,.22); margin-bottom:.6vh}
  .site-page.venue-page h1{font-size:clamp(1rem,2.2vw,1.55rem); letter-spacing:.2em;
    text-indent:.2em; margin:0; line-height:1.35; text-shadow:1px 0 0 rgba(255,60,110,.14), -1px 0 0 rgba(70,190,255,.13)}
  .site-page.venue-page h1 .en{display:inline; font-size:.5em; letter-spacing:.4em;
    margin-left:1em; color:#9aa7b2}
  .site-page.venue-page .prep{font-size:.64rem; letter-spacing:.12em; color:#9fb0c6;
    line-height:1.6; margin:0 0 0 auto; text-align:right; white-space:nowrap}
  body.venue-page .rule{display:none}
  body.venue-page .vFade, body.venue-page #viewTabs{display:none}

  #frame{flex:1 1 auto; min-height:0; position:relative; display:flex}
  #stage{flex:1; min-width:0; display:flex; gap:12px; min-height:0}
  body.venue-page #planCard, body.venue-page #exCard{
    width:auto; margin:0; flex:1 1 0; min-width:0; min-height:0;
    display:flex; flex-direction:column; position:relative; overflow:hidden;
    background:radial-gradient(140% 130% at 50% 0%, #121a38 0%, #0a0e20 58%, #060914 100%);
    border:1px solid rgba(140,150,220,.16); border-radius:4px;
    box-shadow:0 16px 60px rgba(0,0,0,.55), 0 0 90px rgba(226,40,70,.06)}
  body[data-mode="0"] #exCard{display:none}
  body[data-mode="2"] #planCard{display:none}

  body.venue-page #planBar{padding:.42em .7em; gap:.55em; font-size:.8em}
  body.venue-page #planBar label{font-size:.72rem}
  body.venue-page #planSearchBtn, body.venue-page #planSearch, body.venue-page #planFloor{font-size:.72rem; padding:.26em .6em}
  body.venue-page #planHint{display:none}
  #planSvgWrap{flex:1 1 auto; min-height:0; display:flex; position:relative; overflow:hidden}
  body.venue-page #planSvg{width:100%; height:100%; max-width:none; max-height:none; margin:0}
  body.venue-page #exCard{padding:.45em .7em}
  body.venue-page #exCard .exHead{font-size:.78rem}
  body.venue-page #exPanel{flex:1; min-height:0; overflow:auto; margin-top:.4em}
  body.venue-page .exNote{margin-top:.5em; font-size:.66rem}

  /* 中央から開くワイプ（入場・モード切替） */
  #wipe{position:absolute; inset:0; z-index:90; pointer-events:none}
  #wipe i{position:absolute; top:0; bottom:0; width:50.6%; transition:transform .34s cubic-bezier(.7,0,.25,1)}
  #wipe .wL{left:0; transform:translateX(0)}
  #wipe .wR{right:0; transform:translateX(0)}
  body.venue-page.arrived #wipe .wL{transform:translateX(-103%)}
  body.venue-page.arrived #wipe .wR{transform:translateX(103%)}
  #wipe i{background:linear-gradient(180deg,#03040b 0%,#0d1124 55%,#070a16 100%);
    box-shadow:0 0 46px rgba(0,0,0,.75)}
  /* cover中は中央に閉じる */

  /* 下部スライダー（3停止・VHSテープ風のツマミ） */
  #modeBar{flex:0 0 auto; position:relative; z-index:130; display:flex; align-items:center;
    gap:1.1em; padding:.4em .9em .45em; margin-top:.5vh;
    background:linear-gradient(180deg, rgba(7,9,18,.4), rgba(8,10,20,.94));
    border-top:1px solid rgba(150,90,120,.35);
    box-shadow:0 -8px 30px rgba(0,0,0,.4)}
  .miniLeg{display:flex; gap:.8em; flex-wrap:nowrap; margin-right:auto; overflow:hidden;
    font-family:"DotGothic16",monospace; font-size:.58rem; letter-spacing:.08em; color:#a9b4c8}
  .miniLeg span{display:flex; align-items:center; gap:.32em; white-space:nowrap}
  .miniLeg i{display:inline-block; width:9px; height:9px; border-radius:2px}
  .miniLeg .st{color:#f5b0a0}
  .rail{position:relative; flex:0 0 auto; display:flex; align-items:center; width:min(440px,36vw); height:38px;
    background:rgba(16,21,40,.8); border:1px solid rgba(130,150,215,.4); border-radius:20px; padding:3px}
  .rail::before{content:""; position:absolute; top:3px; bottom:3px; left:3px; width:calc((100% - 6px)/3);
    border-radius:17px;
    background:linear-gradient(180deg,#6b2133,#8e2b3f 55%,#5a1828);
    border:1px solid rgba(255,130,150,.55);
    box-shadow:0 0 16px rgba(255,80,120,.5), inset 0 1px 0 rgba(255,200,210,.25);
    transition:left .5s cubic-bezier(.65,0,.3,1)}
  body[data-mode="0"] .rail::before{left:3px}
  body[data-mode="1"] .rail::before{left:calc(3px + (100% - 6px)/3)}
  body[data-mode="2"] .rail::before{left:calc(3px + 2*(100% - 6px)/3)}
  .rail button{flex:1; position:relative; z-index:1; background:none; border:0; cursor:pointer;
    font-family:"DotGothic16",monospace; font-size:.64rem; letter-spacing:.14em;
    color:#aeb8cc; padding:.1em 0 .15em; transition:color .25s}
  .rail button.on{color:#ffe6d2; text-shadow:0 0 8px rgba(255,170,150,.6)}
  .mHint{margin-left:auto; font-family:"DotGothic16",monospace; font-size:.58rem;
    letter-spacing:.12em; color:#76839c; white-space:nowrap}
  .mHint b{color:#c9d6ee; letter-spacing:.1em}
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}}
  @media (pointer:coarse){ #planHint{display:none} }
</style>
</head>
<body class="site-page venue-page" data-mode="1">
<div class="vhsbar" aria-hidden="true"></div>
<div class="vhsbar b2" aria-hidden="true"></div>
<div class="recTag" aria-hidden="true"><i></i>REC</div>
<div class="timecode" id="timecode" aria-hidden="true">-02:31:07</div>
<div class="scene">
  <i class="vhsnoise" aria-hidden="true"></i>
  <div class="wrap">
  <header class="vHead">
    <h1>会場案内<span class="en">VENUE MAP</span></h1>
    <p class="prep">★＝一年三組 ／ 「高さの段」で階を切替 ／ 部屋名で検索OK</p>
  </header>

  <div id="frame">
    <div id="stage">
      <section id="planCard" class="pane" aria-label="俯視マップ">
        <div id="planBar">
          <label for="planFloor">高さの段</label>
          <select id="planFloor"></select>
          <input id="planSearch" type="search" placeholder="部屋を検索（例：高1-1 / 図書室）">
          <button id="planSearchBtn" type="button">検索</button>
          <select id="searchPick" style="display:none"></select>
          <span id="searchMsg"></span>
        </div>
        <div id="planSvgWrap">
          <svg id="planSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </section>
      <section id="exCard" class="pane" aria-label="展開図">
        <div class="exHead">棟別フロア（展開図）<span>＝引き出し表示</span></div>
        <div id="exPanel"></div>
        <p class="exNote">★赤＝一年三組（A2F・高1-3） ／ 渡廊下：D2F⇄B1F</p>
      </section>
    </div>
    <div id="wipe" aria-hidden="true"><i class="wL"></i><i class="wR"></i></div>
  </div>

  <div id="modeBar">
    <div class="miniLeg">
      <span><i style="background:#e5d7cf"></i>高校3F</span>
      <span><i style="background:#dfe6f6"></i>中高2F</span>
      <span><i style="background:#fbe9c8"></i>中学1F</span>
      <span><i style="background:#e6dcef"></i>D総合</span>
      <span><i style="background:#b8bfd0"></i>体育館</span>
      <span class="st"><i style="background:#c0392b"></i>★一年三組＝高1-3</span>
    </div>
    <div class="rail" id="modeRail">
      <button type="button" data-m="0">地図</button>
      <button type="button" data-m="1" class="on">地図＋展開図</button>
      <button type="button" data-m="2">展開図</button>
    </div>
    <div class="mHint"><b>← →</b> でも切替</div>
  </div>
</div>
</div>
<script src="src/venue.js"></script>
<script>
/* 録画タイムコード：1秒ずつ巻き戻る（VHSの画面隅の時刻表示） */
(function () {
  var tc = document.getElementById("timecode");
  if (!tc) return;
  var mm = 2, ss = 31, ff = 0;
  setInterval(function () {
    ff = Math.floor(Math.random() * 30);
    tc.textContent = "-" + String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0") + ":" + String(ff).padStart(2, "0");
    ss -= 1;
    if (ss < 0) { ss = 59; mm -= 1; if (mm < 0) mm = 59; }
  }, 900);
})();
/* 3モード切替：0=地図のみ 1=地図＋展開図 2=展開図のみ（中央ワイプで切替） */
(function () {
  var btns = Array.prototype.slice.call(document.querySelectorAll("#modeRail button"));
  var body = document.body;
  var busy = false;
  function setMode(m) {
    body.setAttribute("data-mode", String(m));
    btns.forEach(function (b) { b.classList.toggle("on", parseInt(b.getAttribute("data-m"), 10) === m); });
  }
  function flip(m) {
    if (busy) return;
    busy = true;
    body.classList.remove("arrived");          /* ワイプが中央で閉じる */
    setTimeout(function () {
      setMode(m);
      body.classList.add("arrived");           /* 中央から開く */
      busy = false;
    }, 350);
  }
  btns.forEach(function (b) {
    b.addEventListener("click", function () { flip(parseInt(b.getAttribute("data-m"), 10)); });
  });
  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (/INPUT|SELECT|TEXTAREA/.test(tag)) return;
    var cur = parseInt(body.getAttribute("data-mode") || "1", 10);
    if (e.key === "ArrowLeft") { e.preventDefault(); flip(cur === 0 ? 2 : cur - 1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); flip(cur === 2 ? 0 : cur + 1); }
  });
  /* 入場：初期は中央の幕、すこし待って左右へ開く */
  setTimeout(function () { body.classList.add("arrived"); }, 260);
  window.__mode = { flip: flip, cur: function () { return parseInt(body.getAttribute("data-mode") || "1", 10); } };
})();
</script>
<script src="src/site.js"></script>
</body>
</html>
